name: Release

# 触发条件：
#   1. 推送 v 开头的 tag（如 v1.0.0）→ 自动构建并上传到 GitHub Release
#   2. 手动触发（workflow_dispatch）→ 仅构建并产出 artifact，便于测试，不会创建 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 上传产物到 Release 需要 release 写权限

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # 满足项目要求 >=3.10.9
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: python build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoList-windows-exe
          path: dist/TodoList.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TodoList.exe
          generate_release_notes: true   # 自动根据 commit 生成更新说明
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
